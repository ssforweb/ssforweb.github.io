<!DOCTYPE html>
<html>
    <body>
        <h1>The Fibonachi Sequence</h1>
        <p id="display"></p>
    </body>
    <script>
        const fib = [BigInt(1), BigInt(1)]
        setInterval(() => {
            fib.push(fib[fib.length - 1] + fib[fib.length - 2])
            document.getElementById("display").innerHTML = "•" + fib.toString().replaceAll(",", "<br>•")
        }, 0)
    </script>
    <style>
        @keyframes pulse {
            0% {background-color: rgb(74, 115, 219);}
            50% {background-color: rgb(30, 62, 144);}
            100% {background-color: rgb(74, 115, 219);}
        }

        h1 {
            font-family:'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
            color: white;
        }
        p {
            font-family:'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
            color: white;
        }
        body {
            background-color: rgb(74, 115, 219);
        }
        body:hover {
            animation-name: pulse;
            animation-duration: 5s;
            animation-iteration-count: infinite;
        }
    </style>
</html>
